# Plan de déploiement Render (gratuit). Utilisable via « New > Blueprint » sur dashboard.render.com.
databases:
  - name: lechatnoir-db
    plan: free
    region: frankfurt
services:
  - type: web
    name: lechatnoir-sisteron
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lechatnoir-db
          property: connectionString
      - key: ADMIN_PASSWORD
        generateValue: true
